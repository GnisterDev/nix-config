# Who can decrypt secrets/*.yaml. Add a host by converting its SSH host key:
#   ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub
# then list it below and run `sops updatekeys secrets/secrets.yaml`.
keys:
  - &wsl age1dyj5762afjp0lw9ydw4cy8hegqpvxayfe4tzfrlt4y02gr23m5zsgdqh78
  # - &laptop  age1...
  # - &desktop age1...
  # - &server  age1...
creation_rules:
  - path_regex: secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *wsl
          # - *laptop
          # - *desktop
          # - *server
